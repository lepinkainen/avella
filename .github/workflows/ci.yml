name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # Single source of truth — do not pin a literal here
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Run tests with coverage
        run: task test-ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      # CI checks formatting rather than rewriting it — `task lint` mutates
      # files, which would pass silently here and leave the repo unformatted.
      - name: Check formatting
        run: |
          unformatted=$(goimports -l . | grep -v -e '^llm-shared/' -e '^tray/' || true)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with goimports:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet $(go list ./... | grep -v -e llm-shared -e tray)

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build
        run: task build-ci
