version: '3'

vars:
  BUILD_DIR: build
  PROJECT_NAME: avella
  # Own packages only. `go fix` mutates source, and llm-shared is a read-only
  # submodule that a bare ./... would rewrite and leave dirty.
  GO_PACKAGES:
    sh: go list ./... | grep -v -e llm-shared -e tray | tr '\n' ' '
  VERSION:
    sh: |
      tag=$(git describe --tags 2>/dev/null || echo "dev")
      commit=$(git log -n 1 --format=%h 2>/dev/null || echo "none")
      if [ "$tag" = "dev" ]; then
        echo "dev-$(date '+%Y-%m-%d_%H:%M:%S')"
      else
        echo "$tag-$commit"
      fi

tasks:
  build:
    desc: Build the project
    # Sequenced, not deps: Task runs deps in parallel, and `go mod tidy` in
    # lint races `go test` into a spurious "missing go.sum entry".
    cmds:
      - task: lint
      - task: test
      - task: build-go
      - task: build-tray

  build-linux:
    desc: Build for Linux
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - task: lint
      - task: test
      - task: build-go

  build-ci:
    desc: Build for CI/CD (build only)
    cmds:
      - task: build-go

  test:
    desc: Run tests
    cmds:
      - task: test-go
      - task: test-tray

  test-ci:
    desc: Run tests with coverage for CI
    cmds:
      - task: test-go-ci

  lint:
    desc: Lint code
    cmds:
      - task: lint-go

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - mkdir -p {{.BUILD_DIR}}

  build-tray:
    desc: Build Swift menu bar app and package as .app bundle
    dir: tray
    cmds:
      - swift build -c release
      - mkdir -p ../{{.BUILD_DIR}}/AvellaTray.app/Contents/MacOS
      - mkdir -p ../{{.BUILD_DIR}}/AvellaTray.app/Contents/Resources
      - cp .build/release/AvellaTray ../{{.BUILD_DIR}}/AvellaTray.app/Contents/MacOS/
      - cp Info.plist ../{{.BUILD_DIR}}/AvellaTray.app/Contents/
      - cp Sources/AvellaTrayLib/Resources/icon.png ../{{.BUILD_DIR}}/AvellaTray.app/Contents/Resources/
      - cp Sources/AvellaTrayLib/Resources/AppIcon.icns ../{{.BUILD_DIR}}/AvellaTray.app/Contents/Resources/
      - codesign --sign - --force ../{{.BUILD_DIR}}/AvellaTray.app
    sources:
      - tray/Sources/**/*.swift
      - tray/Sources/AvellaTrayLib/Resources/AppIcon.icns
      - tray/Package.swift
      - tray/Info.plist
    generates:
      - "{{.BUILD_DIR}}/AvellaTray.app/Contents/MacOS/AvellaTray"

  build-go:
    desc: Build Go project
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -v -ldflags="-X main.Version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.PROJECT_NAME}} .
    sources:
      - ./**/*.go
    generates:
      - "{{.BUILD_DIR}}/{{.PROJECT_NAME}}"

  test-go:
    desc: Run Go tests
    cmds:
      - go test {{.GO_PACKAGES}}

  test-go-ci:
    desc: Run Go tests with coverage for CI
    cmds:
      - go test -tags=ci -cover -v {{.GO_PACKAGES}}

  test-tray:
    desc: Run Swift tray unit tests
    dir: tray
    cmds:
      - swift test

  lint-go:
    desc: Lint Go code
    cmds:
      # go fix first: its rewrites can add imports, which goimports then formats.
      - go fix {{.GO_PACKAGES}}
      - find . -name "*.go" -not -path "./llm-shared/*" -not -path "./tray/*" -exec goimports -w {} +
      - go vet {{.GO_PACKAGES}}
      - golangci-lint run
      - go mod tidy

  vuln-go:
    desc: Scan dependencies for known vulnerabilities (advisory, not gated on lint)
    cmds:
      - govulncheck {{.GO_PACKAGES}}

  deadcode-go:
    desc: Report unreachable functions (advisory, not gated on lint)
    cmds:
      # Interface-satisfying methods proven via `var _ Iface = (*T)(nil)` show up
      # here as expected false positives.
      - deadcode {{.GO_PACKAGES}}

  cognit-go:
    desc: Report functions with cognitive complexity over 20 (advisory, not gated on lint)
    cmds:
      - gocognit -over 20 -ignore 'llm-shared|tray' -json . | jq -r '.[] | "\(.Complexity)\t\(.PkgName).\(.FuncName)\t\(.Pos.Filename):\(.Pos.Line)"'

  install:
    desc: Build and install binaries and load launchd agents
    deps: [build]
    cmds:
      - launchctl bootout gui/$(id -u)/xyz.endymion.avella 2>/dev/null || true
      # Legacy cleanup: the tray now autolaunches via SMAppService, not launchd.
      - launchctl bootout gui/$(id -u)/xyz.endymion.avella-tray 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/xyz.endymion.avella-tray.plist
      - sudo install -m 755 build/avella /usr/local/bin/avella
      - sudo rm -rf /Applications/AvellaTray.app
      - sudo cp -R build/AvellaTray.app /Applications/
      - cp xyz.endymion.avella.plist ~/Library/LaunchAgents/
      - launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/xyz.endymion.avella.plist

  uninstall:
    desc: Unload launchd agents and remove binaries
    cmds:
      - launchctl bootout gui/$(id -u)/xyz.endymion.avella 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/xyz.endymion.avella.plist
      # Legacy cleanup: the tray used to autolaunch via its own launchd agent;
      # it's now handled by SMAppService from within the app. Best-effort
      # removal for upgraders who still have the old agent installed.
      - launchctl bootout gui/$(id -u)/xyz.endymion.avella-tray 2>/dev/null || true
      - rm -f ~/Library/LaunchAgents/xyz.endymion.avella-tray.plist
      - sudo rm -f /usr/local/bin/avella
      - sudo rm -rf /Applications/AvellaTray.app

  dev:
    desc: Run in development mode
    cmds:
      - go run . --config config.yaml
